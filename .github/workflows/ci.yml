name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual dispatch for when GH Actions misses a push/pull_request event
  # (it happens). Lets the rollup `ci` check be regenerated on demand from
  # the Actions tab or via `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Single rollup check that branch protection requires.
  # Green iff every matrix cell of lint-and-build was green.
  # Stable name across matrix changes — don't rename without updating the
  # branch protection rule on master.
  ci:
    if: always()
    needs: [lint-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.lint-and-build.result }}" != "success" ]; then
            echo "lint-and-build matrix did not succeed: ${{ needs.lint-and-build.result }}"
            exit 1
          fi
